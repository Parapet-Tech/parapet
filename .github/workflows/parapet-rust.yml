name: Parapet Rust

permissions:
  contents: read

on:
  push:
    branches: [main]
    paths:
      - "parapet/**"
      - ".github/workflows/parapet-rust.yml"
  # Required workflows must start for every pull request. A path-filtered
  # required workflow remains pending on unrelated changes and blocks merges.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: parapet

jobs:
  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "parapet -> target"
      - run: cargo test --locked

  required:
    name: Rust tests passed
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every Rust test job passed
        env:
          TEST_RESULT: ${{ needs.test.result }}
        run: test "$TEST_RESULT" = success
        working-directory: .
