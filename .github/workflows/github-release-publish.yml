name: Publish GitHub release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact existing release tag (v0.1.0)
        required: true
        type: string
      expected_commit:
        description: Reviewed 40-character commit SHA
        required: true
        type: string
      wheel_set_sha256:
        description: SHA-256 of the reviewed sorted wheel digest list
        required: true
        type: string
      release_manifest_sha256:
        description: Reviewed SHA-256 of RELEASE_SHA256SUMS
        required: true
        type: string
      authorization:
        description: Type exactly PUBLISH GITHUB RELEASE v0.1.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-github-release-v0.1.0
  cancel-in-progress: false

jobs:
  publish:
    name: Publish the complete reviewed draft release
    runs-on: ubuntu-latest
    environment:
      name: github-release
    env:
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_WHEEL_SET_SHA256: ${{ inputs.wheel_set_sha256 }}
      EXPECTED_RELEASE_MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
      NAMED_AUTHORIZATION: ${{ inputs.authorization }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Validate named authorization
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$RELEASE_TAG" = "v0.1.0"
          test "$NAMED_AUTHORIZATION" = "PUBLISH GITHUB RELEASE v0.1.0"
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$EXPECTED_WHEEL_SET_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$EXPECTED_RELEASE_MANIFEST_SHA256" =~ ^[0-9a-f]{64}$ ]]

      - name: Check out the exact tag
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify the draft release and tag binding
        shell: bash
        run: |
          set -euo pipefail
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          release_json=$(gh release view "$RELEASE_TAG" \
            --json tagName,targetCommitish,isDraft,isPrerelease,isImmutable,assets)
          test "$(jq -r .tagName <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r .targetCommitish <<<"$release_json")" = "$tag_commit"
          test "$(jq -r .isDraft <<<"$release_json")" = "true"
          test "$(jq -r .isPrerelease <<<"$release_json")" = "false"
          test "$(jq -r .isImmutable <<<"$release_json")" = "false"
          RELEASE_JSON="$release_json" TAG_COMMIT="$tag_commit" python3 - <<'PY'
          from hmac import compare_digest
          import json
          import os

          tag_commit = os.environ["TAG_COMMIT"]
          expected_commit = os.environ["EXPECTED_COMMIT"]
          if not compare_digest(tag_commit, expected_commit):
              raise SystemExit(
                  f"tag commit does not match reviewed commit: tag={tag_commit} reviewed={expected_commit}"
              )

          payload = json.loads(os.environ["RELEASE_JSON"])
          assets = payload.get("assets")
          if not isinstance(assets, list):
              raise SystemExit("release response is missing assets")
          names = [item.get("name") for item in assets]
          if len(names) != len(set(names)):
              raise SystemExit("duplicate release asset names")
          for item in assets:
              if not isinstance(item.get("size"), int) or item["size"] <= 0:
                  raise SystemExit(f"empty release asset: {item.get('name')!r}")
          PY

      - name: Download every draft release asset
        shell: bash
        run: |
          set -euo pipefail
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets

      - name: Verify the detached manifest and complete asset set
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(gh release view "$RELEASE_TAG" --json assets)
          RELEASE_JSON="$release_json" python3 - <<'PY'
          from email.parser import BytesParser
          from hmac import compare_digest
          import hashlib
          import json
          import os
          import re
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile

          root = Path("release-assets")
          manifest_name = "parapet-v0.1.0-RELEASE_SHA256SUMS"
          manifest = root / manifest_name
          if not manifest.is_file() or manifest.is_symlink():
              raise SystemExit("missing regular detached release checksum manifest")
          observed_manifest_sha256 = hashlib.sha256(manifest.read_bytes()).hexdigest()
          expected_manifest_sha256 = os.environ["EXPECTED_RELEASE_MANIFEST_SHA256"]
          if not compare_digest(observed_manifest_sha256, expected_manifest_sha256):
              raise SystemExit(
                  "release manifest does not match reviewed bytes: "
                  f"observed={observed_manifest_sha256} reviewed={expected_manifest_sha256}"
              )

          entries = {}
          line_re = re.compile(r"^([0-9a-f]{64})  ([^/]+)$")
          for line in manifest.read_text(encoding="utf-8").splitlines():
              match = line_re.fullmatch(line)
              if match is None:
                  raise SystemExit(f"invalid checksum line: {line!r}")
              digest, name = match.groups()
              if PurePosixPath(name).name != name or name == manifest_name or name in entries:
                  raise SystemExit(f"invalid checksum entry: {name!r}")
              entries[name] = digest

          release = json.loads(os.environ["RELEASE_JSON"])
          api_assets = release.get("assets")
          if not isinstance(api_assets, list):
              raise SystemExit("release response is missing assets")
          api_sizes = {item.get("name"): item.get("size") for item in api_assets}
          if len(api_sizes) != len(api_assets):
              raise SystemExit("duplicate release asset names")
          for name, size in api_sizes.items():
              if not isinstance(name, str) or not isinstance(size, int) or size <= 0:
                  raise SystemExit(f"invalid release asset metadata: {name!r}")

          files = {}
          for path in root.iterdir():
              if path.is_symlink() or not path.is_file():
                  raise SystemExit(f"unexpected non-regular release asset: {path.name!r}")
              files[path.name] = path
          if set(files) != set(api_sizes):
              raise SystemExit("downloaded asset set does not match draft release metadata")
          if set(entries) != set(files) - {manifest_name}:
              raise SystemExit("checksum manifest does not cover the exact downloadable asset set")
          for name, path in files.items():
              if path.stat().st_size != api_sizes[name]:
                  raise SystemExit(f"release asset size mismatch: {name}")

          required = {
              "parapet-v0.1.0-macos-arm64-evaluator.tar.gz",
              "parapet-v0.1.0-release-evidence.tar.gz",
          }
          wheels = sorted(name for name in entries if name.endswith(".whl"))
          if len(wheels) != 5:
              raise SystemExit(f"expected 5 release wheels, found {len(wheels)}")
          expected_assets = required | set(wheels)
          if set(entries) != expected_assets:
              raise SystemExit(
                  "release asset set mismatch: "
                  f"expected={sorted(expected_assets)!r} observed={sorted(entries)!r}"
              )

          platform_classes = {
              "manylinux_2_17_x86_64": "manylinux-x86_64",
              "manylinux_2_17_x86_64.manylinux2014_x86_64": "manylinux-x86_64",
              "manylinux_2_17_aarch64": "manylinux-aarch64",
              "manylinux_2_17_aarch64.manylinux2014_aarch64": "manylinux-aarch64",
              "macosx_11_0_arm64": "macos-arm64",
              "macosx_10_12_x86_64": "macos-x86_64",
              "win_amd64": "windows-amd64",
          }
          expected_classes = {
              "manylinux-x86_64",
              "manylinux-aarch64",
              "macos-arm64",
              "macos-x86_64",
              "windows-amd64",
          }
          observed_classes = set()
          for name in wheels:
              path = files[name]
              parts = path.stem.split("-")
              if len(parts) != 5:
                  raise SystemExit(f"unexpected wheel filename: {name}")
              distribution, version, python_tag, abi_tag, platform_tag = parts
              if (distribution, version, python_tag, abi_tag) != (
                  "parapet", "0.1.0", "py3", "none"
              ):
                  raise SystemExit(f"unexpected wheel identity: {name}")
              platform_class = platform_classes.get(platform_tag)
              if platform_class is None or platform_class in observed_classes:
                  raise SystemExit(f"unexpected or duplicate wheel platform: {name}")
              observed_classes.add(platform_class)
              with ZipFile(path) as archive:
                  metadata_paths = [
                      member for member in archive.namelist()
                      if member.endswith(".dist-info/METADATA")
                  ]
                  wheel_paths = [
                      member for member in archive.namelist()
                      if member.endswith(".dist-info/WHEEL")
                  ]
                  if len(metadata_paths) != 1 or len(wheel_paths) != 1:
                      raise SystemExit(f"invalid wheel metadata layout: {name}")
                  metadata = BytesParser().parsebytes(archive.read(metadata_paths[0]))
                  if metadata.get("Name") != "parapet" or metadata.get("Version") != "0.1.0":
                      raise SystemExit(f"wheel metadata identity mismatch: {name}")
                  wheel_text = archive.read(wheel_paths[0]).decode("utf-8")
                  if f"Tag: py3-none-{platform_tag}" not in wheel_text.splitlines():
                      raise SystemExit(f"wheel tag mismatch: {name}")
          if observed_classes != expected_classes:
              raise SystemExit(
                  "wheel platform set mismatch: "
                  f"expected={sorted(expected_classes)!r} observed={sorted(observed_classes)!r}"
              )

          for name, digest in entries.items():
              path = files[name]
              observed = hashlib.sha256(path.read_bytes()).hexdigest()
              if observed != digest:
                  raise SystemExit(f"release asset digest mismatch: {name}")
              print(f"{digest}  {name}")
          wheel_digest_lines = [f"{entries[name]}  {name}" for name in wheels]
          observed_wheel_set = hashlib.sha256(
              ("\n".join(sorted(wheel_digest_lines)) + "\n").encode("utf-8")
          ).hexdigest()
          expected_wheel_set = os.environ["EXPECTED_WHEEL_SET_SHA256"]
          if not compare_digest(observed_wheel_set, expected_wheel_set):
              raise SystemExit(
                  "release wheels do not match reviewed PyPI wheel bytes: "
                  f"observed={observed_wheel_set} reviewed={expected_wheel_set}"
              )
          PY
          jq -cS '[.assets[] | {id,name,size,updatedAt,digest}] | sort_by(.name)' \
            <<<"$release_json" > "$RUNNER_TEMP/release-assets.json"

      - name: Make the reviewed draft release public
        shell: bash
        run: |
          set -euo pipefail
          tag_commit=$(git rev-list -n 1 "$RELEASE_TAG")
          test "$tag_commit" = "$EXPECTED_COMMIT"
          before_publish=$(gh release view "$RELEASE_TAG" \
            --json tagName,targetCommitish,isDraft,isPrerelease,isImmutable,assets)
          test "$(jq -r .tagName <<<"$before_publish")" = "$RELEASE_TAG"
          test "$(jq -r .targetCommitish <<<"$before_publish")" = "$tag_commit"
          test "$(jq -r .isDraft <<<"$before_publish")" = "true"
          test "$(jq -r .isPrerelease <<<"$before_publish")" = "false"
          test "$(jq -r .isImmutable <<<"$before_publish")" = "false"
          expected_assets=$(cat "$RUNNER_TEMP/release-assets.json")
          observed_assets=$(jq -cS \
            '[.assets[] | {id,name,size,updatedAt,digest}] | sort_by(.name)' \
            <<<"$before_publish")
          test "$observed_assets" = "$expected_assets"

          gh release edit "$RELEASE_TAG" --draft=false --latest --verify-tag
          published=$(gh release view "$RELEASE_TAG" \
            --json tagName,targetCommitish,isDraft,isPrerelease,publishedAt,assets)
          test "$(jq -r .tagName <<<"$published")" = "$RELEASE_TAG"
          test "$(jq -r .targetCommitish <<<"$published")" = "$tag_commit"
          test "$(jq -r .isDraft <<<"$published")" = "false"
          test "$(jq -r .isPrerelease <<<"$published")" = "false"
          test "$(jq -r .publishedAt <<<"$published")" != "null"
          published_assets=$(jq -cS \
            '[.assets[] | {id,name,size,updatedAt,digest}] | sort_by(.name)' \
            <<<"$published")
          test "$published_assets" = "$expected_assets"
