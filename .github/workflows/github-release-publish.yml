name: Publish GitHub release

on:
  workflow_dispatch:
    inputs:
      tag: {description: Exact existing release tag, required: true, type: string}
      expected_commit: {description: Reviewed release commit, required: true, type: string}
      expected_tree: {description: Reviewed release tree, required: true, type: string}
      expected_archive_sha256: {description: Reviewed canonical archive SHA-256, required: true, type: string}
      wheel_set_sha256: {description: Reviewed wheel-set SHA-256, required: true, type: string}
      release_manifest_sha256: {description: Reviewed detached manifest SHA-256, required: true, type: string}
      control_commit: {description: Reviewed main control commit, required: true, type: string}
      control_tree: {description: Reviewed main control tree, required: true, type: string}
      workflow_id: {description: Reviewed workflow numeric ID, required: true, type: string}
      workflow_sha256: {description: Reviewed workflow blob SHA-256, required: true, type: string}
      release_text_sha256: {description: Reviewed canonical draft name and body SHA-256, required: true, type: string}
      authorization: {description: Type exactly PUBLISH GITHUB RELEASE v0.2.0, required: true, type: string}

permissions: {}

concurrency:
  group: publish-github-release-v0.2.0
  cancel-in-progress: false

jobs:
  identity:
    name: Bind reviewed control and deployment identity
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.control_commit }}
          fetch-depth: 0
      - name: Independently reproducible control checks
        env:
          GH_TOKEN: ${{ github.token }}
          CONTROL_COMMIT: ${{ inputs.control_commit }}
          CONTROL_TREE: ${{ inputs.control_tree }}
          EXPECTED_WORKFLOW_ID: ${{ inputs.workflow_id }}
          EXPECTED_WORKFLOW_SHA256: ${{ inputs.workflow_sha256 }}
          RELEASE_COMMIT: ${{ inputs.expected_commit }}
          TAG: ${{ inputs.tag }}
          NAMED_AUTHORIZATION: ${{ inputs.authorization }}
          SENDER_LOGIN: ${{ github.event.sender.login }}
          SENDER_ID: ${{ github.event.sender.id }}
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$GITHUB_SHA" = "$CONTROL_COMMIT"
          test "$GITHUB_WORKFLOW_SHA" = "$CONTROL_COMMIT"
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$GITHUB_ACTOR" = "parapet-worker"
          test "$GITHUB_ACTOR_ID" = "319884068"
          test "$GITHUB_TRIGGERING_ACTOR" = "parapet-worker"
          test "$SENDER_LOGIN" = "parapet-worker"
          test "$SENDER_ID" = "319884068"
          test "$TAG" = "v0.2.0"
          test "$NAMED_AUTHORIZATION" = "PUBLISH GITHUB RELEASE v0.2.0"
          test "$(git rev-parse HEAD)" = "$CONTROL_COMMIT"
          test "$(git rev-parse HEAD^{tree})" = "$CONTROL_TREE"
          test -z "$(git status --porcelain)"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CONTROL_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/v0.2.0" --jq .object.sha)" = "$RELEASE_COMMIT"
          test "$(gh api users/parapet-worker --jq '.login+":"+(.id|tostring)+":"+.type')" = "parapet-worker:319884068:User"
          workflow_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/github-release-publish.yml")
          test "$(jq -r .id <<<"$workflow_json")" = "$EXPECTED_WORKFLOW_ID"
          test "$(jq -r .path <<<"$workflow_json")" = ".github/workflows/github-release-publish.yml"
          test "$(sha256sum .github/workflows/github-release-publish.yml | awk '{print $1}')" = "$EXPECTED_WORKFLOW_SHA256"
          run_json=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID")
          test "$(jq -r .workflow_id <<<"$run_json")" = "$EXPECTED_WORKFLOW_ID"
          test "$(jq -r .path <<<"$run_json")" = ".github/workflows/github-release-publish.yml"
          test "$(jq -r .event <<<"$run_json")" = "workflow_dispatch"
          test "$(jq -r .head_branch <<<"$run_json")" = "main"
          test "$(jq -r .head_sha <<<"$run_json")" = "$CONTROL_COMMIT"
          test "$(jq -r .run_attempt <<<"$run_json")" = "1"
          test "$(jq -r '.actor.login+":"+(.actor.id|tostring)' <<<"$run_json")" = "parapet-worker:319884068"
          test "$(jq -r '.triggering_actor.login+":"+(.triggering_actor.id|tostring)' <<<"$run_json")" = "parapet-worker:319884068"
          # GitHub enforces the protected environment before publication.
          # Repository and environment administration endpoints are intentionally
          # unavailable to this restricted workflow token and are enforced externally.
          {
            echo "control_commit=$CONTROL_COMMIT control_tree=$CONTROL_TREE"
            echo "workflow_id=$EXPECTED_WORKFLOW_ID workflow_sha256=$EXPECTED_WORKFLOW_SHA256"
            echo "run_id=$GITHUB_RUN_ID attempt=$GITHUB_RUN_ATTEMPT"
            echo "actor=parapet-worker:319884068 reviewer=protected-environment"
          } >> "$GITHUB_STEP_SUMMARY"

  publish:
    name: Publish the complete reviewed draft
    needs: identity
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: write
    environment:
      name: github-release
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_TAG: ${{ inputs.tag }}
      EXPECTED_COMMIT: ${{ inputs.expected_commit }}
      EXPECTED_TREE: ${{ inputs.expected_tree }}
      EXPECTED_ARCHIVE_SHA256: ${{ inputs.expected_archive_sha256 }}
      EXPECTED_WHEEL_SET_SHA256: ${{ inputs.wheel_set_sha256 }}
      EXPECTED_RELEASE_MANIFEST_SHA256: ${{ inputs.release_manifest_sha256 }}
      CONTROL_COMMIT: ${{ inputs.control_commit }}
      EXPECTED_WORKFLOW_SHA256: ${{ inputs.workflow_sha256 }}
      EXPECTED_RELEASE_TEXT_SHA256: ${{ inputs.release_text_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Re-read immutable bindings after approval
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_RUN_ATTEMPT" = "1"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)" = "$CONTROL_COMMIT"
          test "$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/release/v0.2.0" --jq .object.sha)" = "$EXPECTED_COMMIT"
          test "$(sha256sum <(gh api "repos/$GITHUB_REPOSITORY/contents/.github/workflows/github-release-publish.yml?ref=$CONTROL_COMMIT" --jq .content | tr -d '\n' | base64 --decode) | awk '{print $1}')" = "$EXPECTED_WORKFLOW_SHA256"
          test "$(git cat-file -t "refs/tags/$RELEASE_TAG")" = "tag"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{}")" = "$EXPECTED_COMMIT"
          test "$(git rev-parse "$EXPECTED_COMMIT^{tree}")" = "$EXPECTED_TREE"
          test "$(git archive --format=tar "$EXPECTED_COMMIT" | sha256sum | awk '{print $1}')" = "$EXPECTED_ARCHIVE_SHA256"

      - name: Download and snapshot every draft asset
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(gh release view "$RELEASE_TAG" --json tagName,targetCommitish,isDraft,isPrerelease,isImmutable,name,body,assets)
          test "$(jq -r .tagName <<<"$release_json")" = "$RELEASE_TAG"
          test "$(jq -r .targetCommitish <<<"$release_json")" = "$EXPECTED_COMMIT"
          test "$(jq -r .isDraft <<<"$release_json")" = "true"
          test "$(jq -r .isPrerelease <<<"$release_json")" = "false"
          test "$(jq -r .isImmutable <<<"$release_json")" = "false"
          test "$(jq -S -c '{name,body}' <<<"$release_json" | sha256sum | awk '{print $1}')" = "$EXPECTED_RELEASE_TEXT_SHA256"
          jq -S -c '[.assets[] | {id,name,size,digest,state,contentType,updatedAt}] | sort_by(.name)' <<<"$release_json" > /tmp/assets-before.json
          mkdir release-assets
          gh release download "$RELEASE_TAG" --dir release-assets

      - name: Verify exact detached manifest and asset bytes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from email.parser import BytesParser
          from hashlib import sha256
          from hmac import compare_digest
          import json, os, re
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          root = Path("release-assets")
          manifest_name = "parapet-v0.2.0-RELEASE_SHA256SUMS"
          manifest = root / manifest_name
          if not manifest.is_file() or manifest.is_symlink():
              raise SystemExit("missing regular detached manifest")
          digest = sha256(manifest.read_bytes()).hexdigest()
          if not compare_digest(digest, os.environ["EXPECTED_RELEASE_MANIFEST_SHA256"]):
              raise SystemExit("release manifest does not match reviewed bytes")
          entries = {}
          for line in manifest.read_text().splitlines():
              match = re.fullmatch(r"([0-9a-f]{64})  ([^/]+)", line)
              if match is None:
                  raise SystemExit(f"invalid checksum line: {line!r}")
              value, name = match.groups()
              if PurePosixPath(name).name != name or name == manifest_name or name in entries:
                  raise SystemExit(f"invalid checksum entry: {name!r}")
              entries[name] = value
          files = {p.name: p for p in root.iterdir() if p.is_file() and not p.is_symlink()}
          if len(files) != len(list(root.iterdir())):
              raise SystemExit("non-regular release asset")
          expected_wheels = {
              "parapet-0.2.0-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.whl",
              "parapet-0.2.0-py3-none-manylinux2014_aarch64.manylinux_2_17_aarch64.whl",
              "parapet-0.2.0-py3-none-macosx_11_0_arm64.whl",
              "parapet-0.2.0-py3-none-macosx_10_12_x86_64.whl",
              "parapet-0.2.0-py3-none-win_amd64.whl",
          }
          expected_payloads = expected_wheels | {
              "parapet-v0.2.0-macos-arm64-evaluator.tar.gz",
              "parapet-v0.2.0-release-evidence.tar.gz",
          }
          if set(entries) != expected_payloads or set(files) != expected_payloads | {manifest_name}:
              raise SystemExit("release asset set mismatch")
          wheel_lines = []
          for name, expected in entries.items():
              observed = sha256(files[name].read_bytes()).hexdigest()
              if not compare_digest(observed, expected):
                  raise SystemExit(f"checksum mismatch: {name}")
              if name.endswith(".whl"):
                  with ZipFile(files[name]) as archive:
                      if archive.testzip() is not None:
                          raise SystemExit(f"wheel CRC failure: {name}")
                      meta = [n for n in archive.namelist() if n.endswith(".dist-info/METADATA")]
                      if len(meta) != 1:
                          raise SystemExit("invalid wheel metadata layout")
                      parsed = BytesParser().parsebytes(archive.read(meta[0]))
                      if parsed.get("Name") != "parapet" or parsed.get("Version") != "0.2.0":
                          raise SystemExit("wheel metadata identity mismatch")
                      wheel_meta = [n for n in archive.namelist() if n.endswith(".dist-info/WHEEL")]
                      if len(wheel_meta) != 1:
                          raise SystemExit("invalid wheel metadata layout")
                      platform_tags = Path(name).stem.split("-")[4].split(".")
                      wheel_tags = [
                          line.removeprefix("Tag: ")
                          for line in archive.read(wheel_meta[0]).decode().splitlines()
                          if line.startswith("Tag: ")
                      ]
                      expected_wheel_tags = {f"py3-none-{tag}" for tag in platform_tags}
                      if len(wheel_tags) != len(set(wheel_tags)) or set(wheel_tags) != expected_wheel_tags:
                          raise SystemExit(f"wheel tag mismatch: {name}")
                  wheel_lines.append(f"{observed}  {name}")
          wheel_set = sha256(("\n".join(sorted(wheel_lines)) + "\n").encode()).hexdigest()
          if not compare_digest(wheel_set, os.environ["EXPECTED_WHEEL_SET_SHA256"]):
              raise SystemExit("wheel set does not match reviewed bytes")
          PY

      - name: Re-read draft then make the sole public effect
        shell: bash
        run: |
          set -euo pipefail
          before=$(cat /tmp/assets-before.json)
          current=$(gh release view "$RELEASE_TAG" --json name,body,assets)
          test "$(jq -S -c '{name,body}' <<<"$current" | sha256sum | awk '{print $1}')" = "$EXPECTED_RELEASE_TEXT_SHA256"
          test "$(jq -S -c '[.assets[] | {id,name,size,digest,state,contentType,updatedAt}] | sort_by(.name)' <<<"$current")" = "$before"
          gh release edit "$RELEASE_TAG" --draft=false --latest --verify-tag

      - name: Verify publication did not mutate assets
        shell: bash
        run: |
          set -euo pipefail
          release_json=$(gh release view "$RELEASE_TAG" --json tagName,targetCommitish,isDraft,isPrerelease,isImmutable,name,body,assets)
          test "$(jq -r .isDraft <<<"$release_json")" = "false"
          test "$(jq -r .isPrerelease <<<"$release_json")" = "false"
          test "$(jq -S -c '{name,body}' <<<"$release_json" | sha256sum | awk '{print $1}')" = "$EXPECTED_RELEASE_TEXT_SHA256"
          published=$(jq -S -c '[.assets[] | {id,name,size,digest,state,contentType,updatedAt}] | sort_by(.name)' <<<"$release_json")
          test "$published" = "$(cat /tmp/assets-before.json)"
