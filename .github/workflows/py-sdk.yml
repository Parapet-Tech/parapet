name: Python SDK

on:
  push:
    branches: [main]
    paths: ["parapet/**", "parapet-py/**", ".github/workflows/py-sdk.yml"]
  pull_request:
    paths: ["parapet/**", "parapet-py/**", ".github/workflows/py-sdk.yml"]

defaults:
  run:
    working-directory: parapet-py

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: parapet-py/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest tests/ -v --ignore=tests/test_e2e.py

  build:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: parapet-py/pyproject.toml
      - run: pip install "maturin>=1,<2"
      - run: maturin build --release --locked --out dist
      - name: Verify wheel archive entries and installed CLI smoke
        run: |
          wheel="$(ls dist/parapet-*.whl)"
          listing="$(python -m zipfile -l "$wheel")"
          printf '%s\n' "$listing"
          printf '%s\n' "$listing" | awk '$1 == "parapet/__init__.py" { found=1 } END { exit !found }'
          printf '%s\n' "$listing" | awk '$1 ~ /\/scripts\/parapet-engine$/ { found=1 } END { exit !found }'
          printf '%s\n' "$listing" | awk '$1 ~ /\/scripts\/parapet$/ { found=1 } END { exit !found }'
          printf '%s\n' "$listing" | awk '$1 ~ /(parapet-fetch|parapet-scope-audit|pg2-diag|parapet-eval)$/ { found=1 } END { exit found }'
          python -m venv /tmp/parapet-ci-venv
          /tmp/parapet-ci-venv/bin/python -m pip install "$wheel"
          cd /tmp
          /tmp/parapet-ci-venv/bin/python -c 'import pathlib, parapet; assert "site-packages" in pathlib.Path(parapet.__file__).resolve().parts'
          test -x /tmp/parapet-ci-venv/bin/parapet
          test -x /tmp/parapet-ci-venv/bin/parapet-engine
          test ! -e /tmp/parapet-ci-venv/bin/parapet-fetch
          test ! -e /tmp/parapet-ci-venv/bin/parapet-scope-audit
          test ! -e /tmp/parapet-ci-venv/bin/pg2-diag
          test ! -e /tmp/parapet-ci-venv/bin/parapet-eval
          /tmp/parapet-ci-venv/bin/parapet info --json
          printf 'hello parapet' | /tmp/parapet-ci-venv/bin/parapet scan --stdin --json
      - name: Verify installed CLI deterministic demo guide from neutral cwd
        run: |
          mkdir -p /tmp/parapet-demo-neutral
          awk '/^```sh$/{f=1;next} /^```$/{f=0} f' "$GITHUB_WORKSPACE/parapet/demo/v0/README.md" > /tmp/parapet-demo-guide.sh
          cd /tmp/parapet-demo-neutral
          PATH="/tmp/parapet-ci-venv/bin:$PATH" sh -x /tmp/parapet-demo-guide.sh
